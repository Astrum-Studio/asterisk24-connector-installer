name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  release-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify published v1.0.0 assets
        run: bash scripts/self-test-release-download.sh v1.0.0
