name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify v1.0.1 release assets (published)
        run: bash scripts/self-test-release-download.sh v1.0.1
      - name: Piped autoinstaller (--help)
        run: |
          curl -fsSL "https://github.com/Astrum-Studio/asterisk24-connector-installer/releases/download/v1.0.1/autoinstaller.sh" \
            | bash -s -- --help
