name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "${TAG}" 2>/dev/null \
            || gh release create "${TAG}" --title "Asterisk24 Connector ${TAG}" --notes-file CHANGELOG.md
      - name: Upload autoinstaller.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "${TAG}" --clobber scripts/autoinstaller.sh
      - name: Verify release download + checksum
        run: bash scripts/self-test-release-download.sh "${GITHUB_REF_NAME}"
